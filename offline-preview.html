 <button class="brand" type="button" id="brand-home"><span class="brand-mark">⟁</span><span class="brand-name">SOVEREIGN<br><strong>DESIGN INTELLIGENCE</strong></span></button>
 <div class="rail-divider"></div><span class="rail-kicker">WORKSPACE</span>

<script>
window.__OFFLINE_PREVIEW__ = true;
const MOCK_REPORT = {"id": "audit-mv79m011", "createdAt": "2026-10-13T22:41:08.773Z", "sample": true, "title": "Morrow & Pine · Sample company", "scope": "Illustrative example — no live website was inspected", "mode": "url", "engine": "structure-review", "summary": "This fictional manufacturing example demonstrates how an assessment can distinguish visible signals, hypotheses, and recommendations. No actual company was evaluated.", "evidence": [{"id": "E1", "label": "Page title", "value": "Morrow & Pine | Precision Packaging", "type": "page observation"}, {"id": "E2", "label": "Primary headings", "value": "Precision meets possibility", "type": "page observation"}, {"id": "E3", "label": "Meta description", "value": "Custom packaging production for ambitious brands", "type": "page observation"}, {"id": "E4", "label": "Action labels", "value": "Contact us", "type": "page observation"}, {"id": "E5", "label": "Proof cues on inspected page", "value": "No recognizable proof terms detected in returned HTML", "type": "page observation"}, {"id": "E6", "label": "Document structure", "value": "1 H1 · 3 H2 · 11 images · 4 images missing alt attribute · 1 nav elements", "type": "page observation"}], "signals": {"title": "Morrow & Pine | Precision Packaging", "h1": ["Precision meets possibility"], "description": "Custom packaging production for ambitious brands", "imageCount": 11, "missingAlt": 4, "ctaTexts": ["Contact us"], "formCount": 1}, "findings": [{"id": "F1", "area": "Positioning clarity", "heading": "There is an identifiable starting point", "status": "observed", "priority": "medium", "observation": "The page introduces itself with “Precision meets possibility”.", "impact": "A primary heading helps orient first-time visitors, but relevance and comprehension still need validation.", "recommendation": "Check whether the heading immediately connects the offer to the intended customer and business outcome.", "evidenceIds": ["E2", "E1"], "validation": "Conduct a short first-impression test with target customers.", "frameworkIds": ["SDS-INV", "SDS-CHOR"]}, {"id": "F2", "area": "Buyer journey", "heading": "An action pathway is present, but intent needs checking", "status": "observed", "priority": "medium", "observation": "Detected action labels: Contact us.", "impact": "Visible action labels provide a route to progress; placement and effectiveness cannot be inferred from HTML alone.", "recommendation": "Test whether the primary action matches the decision a new visitor is ready to make.", "evidenceIds": ["E4"], "validation": "Walk through the actual inquiry journey and check analytics or usability sessions.", "frameworkIds": ["SDS-CHOR", "SDS-AGENT"]}, {"id": "F3", "area": "Credibility and proof", "heading": "Consider whether enough evidence is visible to first-time buyers", "status": "hypothesis", "priority": "medium", "observation": "The captured page did not contain recognizable case-study, testimonial, or certification labels.", "impact": "New buyers may require concrete proof before committing to an unfamiliar supplier.", "recommendation": "Review whether examples, material outcomes, process evidence, and customer references are accessible where visitors need them.", "evidenceIds": ["E5"], "validation": "Review other pages and ask customers which proof helped their decision.", "frameworkIds": ["SDS-INV", "SDS-CHOR"]}, {"id": "F4", "area": "Visual and content structure", "heading": "Some images lack descriptive text alternatives", "status": "observed", "priority": "medium", "observation": "4 of 11 detected image tags have no alt attribute.", "impact": "Important images may be less accessible to people using assistive technology.", "recommendation": "Provide meaningful alternatives for informative images; reserve empty alt text for purely decorative images.", "evidenceIds": ["E6"], "validation": "Review rendered image semantics and perform keyboard and screen-reader testing.", "frameworkIds": ["SDS-INV", "SDS-CHOR"]}], "frameworkVersion": "2026-10-13.v0.1", "context": {"audience": "unknown", "goal": "understand"}, "question": {"title": "Who matters most on this page?", "detail": "The answer can change which improvements deserve attention first.", "options": [{"id": "new", "label": "Prospective customers exploring us for the first time"}, {"id": "existing", "label": "Existing customers looking for information"}, {"id": "both", "label": "Both audiences are equally important"}]}, "limitations": ["All company details and findings in this sample are fictional and for demonstration only.", "A single publicly accessible page was inspected; this is not a complete site audit.", "HTML structure alone cannot validate rendered visuals, interaction behavior, accessibility compliance, or conversion performance.", "Recommendations are hypotheses until checked against users, business constraints, or analytics."]};
window.fetch = async (url, opts = {}) => {
 const path=String(url), body=opts.body?JSON.parse(opts.body):{};
 const answer=(value,status=200)=>({ok:status<400,status,json:async()=>value});
 if(path==='/api/status')return answer({aiConfigured:false,knowledgeVersion:'2026-10-13.v0.1',knowledgeCount:5});
 if(path==='/api/knowledge')return answer({version:'2026-10-13.v0.1',sources:[
 {title:'System Invariants',url:'https://github.com/wchiu111/sovereign-design-system/blob/main/docs/governance/system-invariants.md'},
 {title:'Information Choreography',url:'https://github.com/wchiu111/sovereign-design-system/blob/main/docs/choreography/information-choreography.md'}]});
 if(path==='/api/assess'){if(body.mode==='demo')return answer({report:structuredClone(MOCK_REPORT)});return answer({error:'This offline preview demonstrates the interface with fictional data only. Run npm start from the full project to assess real websites.'},422)}
 if(path==='/api/refine'){
  const r=structuredClone(body.report);r.context.audience=body.audience;
  r.contextualRecommendation=({new:'Prioritize first-time visitor orientation and a clear inquiry journey.',existing:'Prioritize efficient access to specifications, technical resources, and support.',both:'Provide separate clear paths for new buyers and existing customers.'})[body.audience];
  r.contextRationale='Audience context changes recommendations; it does not change the observed evidence.';
  return answer({report:r});
 }
 if(path==='/api/discuss'){
  const first=body.report.findings[0], q=String(body.question).toLowerCase();
  return answer({answer:{answer:q.includes('evidence')||q.includes('why')?`The sample report cites evidence ${first.evidenceIds.join(', ')} for its first finding. Because this is fictional, these signals only illustrate the reasoning flow.`:`For the illustrative finding, a practical step is: ${first.recommendation} Validate it with actual customer evidence before implementation.`,mode:'offline sample',evidenceIds:first.evidenceIds}});
 }
 return answer({error:'Unsupported offline action'},404);
};
</script><script>const $=s=>document.querySelector(s);
const safe=(v='')=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={
 arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',note:'<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h7"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',print:'<path d="M6 9V3h12v6M6 18H4V9h16v9h-2M6 14h12v7H6z"/>',edit:'<path d="m14 5 5 5M4 20l4.5-1 11-11a2 2 0 0 0-3-3l-11 11z"/>',proof:'<path d="M4 12l5 5L20 6"/>',back:'<path d="m15 18-6-6 6-6"/>',sparkle:'<path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/>',message:'<path d="M3 5h18v12H8l-5 4z"/>',close:'<path d="M6 6l12 12M18 6 6 18"/>',external:'<path d="M13 5h6v6m0-6-9 9M19 14v5H5V5h5"/>'
};
function icon(name,size=18){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.note}</svg>`}
const app=$('#app');
const st={view:'start',mode:'url',report:null,tab:'findings',ai:false,sourceCount:0,busy:false,error:'',url:'',challenge:'',notes:'',imageData:null,imageName:'',imageSize:0,chat:[],audience:'unknown'};
try{const cached=sessionStorage.getItem('sovereign-audit-report');if(cached){st.report=JSON.parse(cached);st.view='report';st.audience=st.report.context?.audience||'unknown';}}catch{}
function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),3500)}
function saveReport(){try{if(st.report)sessionStorage.setItem('sovereign-audit-report',JSON.stringify(st.report));else sessionStorage.removeItem('sovereign-audit-report')}catch{toast('The report could not be stored in this browser tab.')}}
function nav(){const current=!!st.report;$('#nav-current').disabled=!current;$('#nav-new').classList.toggle('selected',st.view==='start'||st.view==='working');$('#nav-current').classList.toggle('selected',st.view==='report');$('#nav-method').classList.toggle('selected',st.view==='method');$('#crumb-current').textContent=st.view==='report'?'EXPERIENCE REVIEW':st.view==='method'?'METHOD & INTEGRITY':'NEW ASSESSMENT';}
function render(){nav();if(st.view==='start')renderStart();else if(st.view==='working')renderWorking();else if(st.view==='report')renderReport();else renderMethod();}
function reset(){if(st.report&&!confirm('Start a new assessment? Your current report is only stored in this browser tab, and will be replaced. Export it first if you want to keep a copy.'))return;st.report=null;st.chat=[];st.mode='url';st.tab='findings';st.error='';st.url='';st.imageData=null;st.imageName='';st.challenge='';st.view='start';saveReport();render();scrollTop()}
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'})}
$('#brand-home').addEventListener('click',reset);$('#nav-new').addEventListener('click',()=>{if(st.view==='start')return;reset()});$('#top-reset').addEventListener('click',reset);$('#nav-current').addEventListener('click',()=>{if(st.report){st.view='report';render();scrollTop()}});$('#nav-method').addEventListener('click',()=>{st.view='method';render();scrollTop()});
function renderStart(){
 const entry=[{id:'url',icon:'globe',title:'Website address',meta:'Public websites & landing pages'},{id:'image',icon:'image',title:'Screenshot',meta:'Visual concepts & interface screens'},{id:'guided',icon:'note',title:'Describe a challenge',meta:'Start with context, not artifacts'}];
 const panel=st.mode==='url'?`<label class="field-label" for="address">WEBSITE ADDRESS</label><div class="input-wrap"><span class="input-prefix">↗</span><input id="address" class="field-input" autocomplete="url" inputmode="url" placeholder="https://yourcompany.com" value="${safe(st.url)}" /></div>`:
 st.mode==='image'?`<label class="field-label" for="imagefile">UPLOAD A VISUAL</label><div class="upload-drop" id="upload-drop">${st.imageData?`<img alt="Preview of selected screenshot" class="image-preview" src="${st.imageData}"/><span class="upload-subtitle">${safe(st.imageName)} · ${Math.round(st.imageSize/1024)} KB</span>`:`${icon('image',25)}<span class="upload-title">Drop an image here or select a file</span><span class="upload-subtitle">PNG, JPG, or WebP · maximum 6 MB</span>`}<input aria-label="Upload a screenshot" id="imagefile" type="file" accept="image/png,image/jpeg,image/webp" /></div><p class="field-hint">${st.ai?'Visual analysis is available. The image is sent to the assessment model only when you submit.':'Screenshot analysis requires an AI key on the server. You can still try the free structural URL review or sample.'}</p><label for="image-notes" class="field-label" style="margin-top:18px">OPTIONAL CONTEXT</label><textarea id="image-notes" class="field-area" placeholder="Who is this for? What are you trying to understand?">${safe(st.notes)}</textarea>`:
 `<label class="field-label" for="challenge">DESCRIBE YOUR BUSINESS CHALLENGE</label><textarea id="challenge" class="field-area" placeholder="We have a technical service that prospective buyers struggle to understand, and we're not sure whether our website explains our value clearly enough…">${safe(st.challenge)}</textarea>`;
 app.innerHTML=`<section class="hero"><div class="top-header-decor" aria-hidden="true"></div><div class="eyebrow"><span class="eyeline"></span>A DIFFERENT KIND OF DESIGN ASSESSMENT</div><h1>See what's working.<br><em>Understand what isn't.</em></h1><p class="hero-copy">An independent space to examine your experience, question assumptions, and discover a clearer way forward. Grounded in evidence. Guided by design intelligence. Yours to explore—completely free.</p></section>
 <section class="intake" aria-labelledby="intake-heading"><div class="section-label" id="intake-heading">01 / BEGIN WITH WHAT YOU HAVE</div><div class="entry-cards">${entry.map(e=>`<button class="entry-card ${st.mode===e.id?'active':''}" type="button" data-mode="${e.id}" aria-pressed="${st.mode===e.id}"><span class="entry-icon">${icon(e.icon,23)}</span><span><span class="entry-title">${e.title}</span><span class="entry-meta">${e.meta}</span></span></button>`).join('')}</div><form id="assess-form" class="intake-pane">${panel}${st.error?`<div class="error-box" role="alert">${safe(st.error)}</div>`:''}<div class="intake-footer"><span class="field-hint">No sign-up. No gated findings. No unnecessary collection of contact details.</span><button class="primary-button" type="submit">Begin assessment ${icon('arrow',16)}</button></div></form><div class="under-card"><small>${st.ai?'◦ AI-assisted reasoning available':'◦ Local structural review · AI optional'} &nbsp;·&nbsp; Sovereign knowledge v0.1</small><button class="text-button" type="button" id="try-demo">Explore a fictional example ↗</button></div></section>
 <section class="process-band" aria-label="How it works"><div class="process-part"><div class="process-index">01</div><div><div class="process-title">Observe, don't assume.</div><div class="process-detail">Review what the available evidence actually supports.</div></div></div><div class="process-part"><div class="process-index">02</div><div><div class="process-title">Understand the context.</div><div class="process-detail">Questions refine—not withhold—the assessment.</div></div></div><div class="process-part"><div class="process-index">03</div><div><div class="process-title">Make your next decision.</div><div class="process-detail">Receive actionable recommendations with full ownership.</div></div></div></section>`;
 document.querySelectorAll('[data-mode]').forEach(el=>el.addEventListener('click',()=>{if(st.mode==='url')st.url=$('#address')?.value||st.url;if(st.mode==='guided')st.challenge=$('#challenge')?.value||st.challenge;if(st.mode==='image')st.notes=$('#image-notes')?.value||st.notes;st.mode=el.dataset.mode;st.error='';renderStart()}));
 $('#assess-form').addEventListener('submit',async e=>{e.preventDefault();if(st.mode==='url')st.url=$('#address').value.trim();if(st.mode==='guided')st.challenge=$('#challenge').value;if(st.mode==='image')st.notes=$('#image-notes').value;await assess()});
 $('#try-demo').addEventListener('click',async()=>{await request({mode:'demo'})});
 if(st.mode==='image'){
   const uploader=$('#imagefile');uploader.addEventListener('change',e=>{const file=e.target.files[0];if(file)loadFile(file)});
   const drop=$('#upload-drop');drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('dragging')});drop.addEventListener('dragleave',()=>drop.classList.remove('dragging'));drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('dragging');if(e.dataTransfer.files?.[0])loadFile(e.dataTransfer.files[0])});
 }
}
async function loadFile(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>6_000_000){st.error='Select a PNG, JPG, or WebP under 6 MB.';renderStart();return;}const reader=new FileReader();reader.onload=()=>{st.imageData=String(reader.result);st.imageName=file.name;st.imageSize=file.size;st.error='';renderStart()};reader.readAsDataURL(file)}
async function assess(){
 if(st.mode==='url'){if(!/^https?:\/\/\S+\./i.test(st.url)){st.error='Enter a full public URL, including https://';renderStart();return;}await request({mode:'url',url:st.url});return;}
 if(st.mode==='image'){if(!st.imageData){st.error='Select a screenshot to evaluate.';renderStart();return;}await request({mode:'image',imageData:st.imageData,imageName:st.imageName,notes:st.notes,objective:'Visual clarity and buyer understanding'});return;}
 if(st.challenge.trim().length<20){st.error='Describe your challenge in at least 20 characters.';renderStart();return;}
 await request({mode:'guided',challenge:st.challenge});
}
async function api(path,data){const res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let obj;try{obj=await res.json()}catch{throw Error(`The server returned an unreadable response (${res.status}).`)}if(!res.ok)throw Error(obj.error||`Request failed (${res.status})`);return obj}
async function request(body){st.view='working';st.error='';render();scrollTop();try{const {report}=await api('/api/assess',body);st.report=report;st.view='report';st.tab='findings';st.audience=report.context?.audience||'unknown';st.chat=[];saveReport();render();scrollTop();toast(report.sample?'Illustrative example loaded.':'Assessment ready. Findings remain free to explore.')}catch(e){st.view='start';st.error=e.message;render();scrollTop()}}
function renderWorking(){app.innerHTML=`<section class="processing"><div class="eyebrow"><span class="eyeline"></span>ASSESSMENT IN PROGRESS</div><div class="loading-ring" role="status" aria-label="Assessing"></div><h2>Looking for the signal<br>behind the surface.</h2><p>We're examining the available evidence and separating observations from questions that still need answers. No score is being invented.</p><span class="mode-tag">PUBLIC PAGE / STRUCTURAL EVIDENCE / SOVEREIGN FRAMEWORKS</span></section>`}
function insightBadge(f){return `<span class="small-status ${safe(f.status)}">${safe(f.status==='observed'?'OBSERVED':f.status==='potential'?'POTENTIAL ISSUE':'HYPOTHESIS')}</span>`}
function reportHeader(r){return `<div class="eyebrow"><span class="eyeline"></span>DESIGN INTELLIGENCE / EXPERIENCE REVIEW</div><div class="report-top"><div><h1 class="report-title">${safe(r.title)}</h1><p class="report-summary">${safe(r.summary)}</p><div class="report-identity"><span class="identity-badge">${safe(r.engine.toUpperCase())}</span><span class="identity-detail">${safe(r.scope)}</span></div></div><div class="report-actions"><button class="icon-button" id="export-md" type="button">${icon('download',15)} Export</button><button class="icon-button" id="print-report" type="button">${icon('print',15)} Print</button></div></div>${r.sample?'<div class="sample-warning">✳ <strong>Fictional example.</strong> All company details and findings are illustrative. No external website was evaluated.</div>':''}`}
function reportTabs(){const tabs=[['findings','Findings & evidence'],['dialogue','Ask the auditor'],['plan','Action plan']];return `<div class="report-tabs" role="tablist" aria-label="Assessment views">${tabs.map(([id,label])=>`<button role="tab" aria-selected="${st.tab===id}" class="report-tab ${st.tab===id?'active':''}" data-tab="${id}" type="button">${label}</button>`).join('')}</div>`}
function findingsView(r){return `<div class="finding-list">${r.findings.map((f,i)=>`<article class="finding-card"><div class="finding-heading-line"><span class="finding-num">${String(i+1).padStart(2,'0')}</span><div class="finding-heading-text"><div class="finding-area">${safe(f.area)} &nbsp; / &nbsp; ${safe(f.priority.toUpperCase())} PRIORITY</div><h3>${safe(f.heading)}</h3></div>${insightBadge(f)}</div><div class="finding-body"><p class="finding-observation">${safe(f.observation)}</p><div class="recommendation-box"><b>RECOMMENDED DIRECTION</b>${safe(f.recommendation)}</div><details class="more-details"><summary>Inspect reasoning and evidence <span>＋</span></summary><p class="side-paragraph"><strong>Why it may matter:</strong> ${safe(f.impact)}</p><div class="evidence-list">${f.evidenceIds.map(id=>{const e=r.evidence.find(x=>x.id===id);return e?`<div class="evidence-line"><b>${safe(e.id)}</b> ${safe(e.label)}: ${safe(e.value)}</div>`:''}).join('')}</div><p class="validation"><strong>How to validate:</strong> ${safe(f.validation)}</p><p class="validation">Framework reference: ${safe(f.frameworkIds.join(' · '))}</p></details></div></article>`).join('')}</div>`}
function contextBox(r){return `<section class="side-box side-box-dark"><div class="side-label">CONTEXT CHANGES THE RECOMMENDATION</div><h2 class="side-headline">Who are we actually designing for?</h2><p class="side-paragraph">${safe(r.question?.detail||'Business context influences priorities. We will not rewrite what the evidence actually shows.')}</p><form id="context-form"><div class="choice-list">${(r.question?.options||[]).map(o=>`<label class="choice"><input type="radio" name="audience" value="${safe(o.id)}" ${st.audience===o.id?'checked':''}/>${safe(o.label)}</label>`).join('')}</div><button type="submit" class="primary-button full">Refine priorities ${icon('arrow',15)}</button></form>${r.contextualRecommendation?`<div class="result-meta">REFINED INTERPRETATION</div><p class="side-paragraph" style="color:#e1e9df">${safe(r.contextualRecommendation)}</p>`:''}</section>`}
function sideEvidence(r){return `<section class="side-box"><div class="side-label">EVIDENCE REGISTER</div><div class="evidence-shell">${r.evidence.map(e=>`<div class="evidence-block"><span class="sourcetag">${safe(e.id)} · ${safe(e.type.toUpperCase())}</span><strong>${safe(e.label)}</strong>${safe(e.value)}</div>`).join('')}</div></section><section class="side-box"><div class="side-label">BOUNDARIES OF THIS REVIEW</div><ul class="limits">${r.limitations.map(x=>`<li>${safe(x)}</li>`).join('')}</ul></section>`}
function findingPage(r){return `<div class="report-grid"><div>${findingsView(r)}</div><aside class="side-stack">${contextBox(r)}${sideEvidence(r)}</aside></div>`}
function dialoguePage(r){
 const initial=`I’ve prepared ${r.findings.length} findings based on the available evidence. You can question an assumption, ask why a recommendation matters, or tell me more about the business. I’ll distinguish what I observed from what still needs validation.`;
 const messages=[{role:'assistant',text:initial},...st.chat];
 return `<div class="report-grid"><section class="dialogue"><div class="dialogue-header"><h2>A conversation, not a verdict.</h2><p>Ask for reasoning, explore alternatives, or challenge an observation. The report remains yours to use.</p></div><div class="dialogue-messages" id="dialogue-messages" aria-live="polite">${messages.map(m=>`<div class="message ${safe(m.role)}"><div class="message-meta">${m.role==='assistant'?'DESIGN INTELLIGENCE':'YOU'}${m.mode?' · '+safe(m.mode.toUpperCase()):''}</div>${safe(m.text)}${m.evidenceIds?.length?`<div class="result-meta">Evidence: ${safe(m.evidenceIds.join(', '))}</div>`:''}</div>`).join('')}</div><form id="dialogue-form" class="dialogue-form"><textarea class="dialogue-textarea" id="question" placeholder="What would you like to understand more deeply?" maxlength="600" aria-label="Ask the auditor"></textarea><div class="dialogue-footer"><span class="mode-tag">${st.ai?'AI-ASSISTED REFLECTION':'RULE-BASED REFLECTION'}</span><button class="primary-button" id="send-question" type="submit">Ask ${icon('arrow',15)}</button></div></form></section><aside class="side-stack"><section class="side-box"><div class="side-label">QUESTIONS WORTH ASKING</div><div class="suggestions"><button class="suggestion" type="button" data-suggest="What evidence supports the first finding?">What supports this finding?</button><button class="suggestion" type="button" data-suggest="What should I prioritize first?">What should we prioritize?</button><button class="suggestion" type="button" data-suggest="How could we implement these recommendations?">How could we improve this?</button></div><p class="tiny-callout">Questions don't unlock a hidden report. You already have the full initial assessment.</p></section>${contextBox(r)}</aside></div>`;
}
function planPage(r){const sorted=[...r.findings].sort((a,b)=>({high:0,medium:1,low:2}[a.priority]??1)-({high:0,medium:1,low:2}[b.priority]??1));return `<div class="report-grid"><div><div class="plan-intro"><div class="side-label">FROM OBSERVATION TO ACTION</div><h2 class="plan-title">A clearer way forward.</h2><p>This plan is a starting point, not a promise of commercial outcomes. Validate assumptions with relevant people before making costly changes.</p>${r.contextualRecommendation?`<div class="recommendation-box"><b>PRIORITY FOR YOUR AUDIENCE</b>${safe(r.contextualRecommendation)}</div>`:''}</div>${sorted.map((f,i)=>`<article class="plan-item"><span class="plan-index">${String(i+1).padStart(2,'0')}</span><div><div class="finding-area">${safe(f.area)} · ${safe(f.priority)} priority</div><h3>${safe(f.heading)}</h3><p>${safe(f.recommendation)}</p><div class="plan-validation">VALIDATE WITH · ${safe(f.validation)}</div></div></article>`).join('')}<div class="action-bar"><button class="secondary-button" id="export-md-plan" type="button">${icon('download',16)} Download full report</button><button class="secondary-button" id="print-report-plan" type="button">${icon('print',16)} Print or save PDF</button></div><div class="collaboration"><div class="side-label">ONLY IF YOU WANT A PARTNER</div><h3>Prefer help implementing the changes?</h3><p>The assessment and recommendations remain free. If you'd rather collaborate on execution, you can choose to start a separate conversation. Nothing is sent unless you deliberately reach out.</p><a class="secondary-button" id="collab-link" href="mailto:hello@wchiudesign.com?subject=${encodeURIComponent('Design implementation inquiry: '+r.title)}&body=${encodeURIComponent('Hello, I used the Design Intelligence assessment and would like to discuss implementation.\n\nProject / company: '+r.title+'\n\nWhat I would like help with:\n')}" >Discuss implementation ${icon('external',15)}</a></div></div><aside class="side-stack"><section class="side-box side-box-dark"><div class="side-label">YOUR AGENCY IS THE OUTCOME</div><h2 class="side-headline">Take the work. Keep the understanding.</h2><p class="side-paragraph">You can implement these recommendations independently. Professional collaboration is optional, never a condition for accessing the report.</p></section>${sideEvidence(r)}</aside></div>`}
function renderReport(){const r=st.report;if(!r){st.view='start';render();return;}app.innerHTML=`<div class="report-wrap">${reportHeader(r)}${reportTabs()}${st.tab==='findings'?findingPage(r):st.tab==='dialogue'?dialoguePage(r):planPage(r)}</div>`;
 document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{st.tab=el.dataset.tab;renderReport()}));
 ['#export-md','#export-md-plan'].forEach(s=>$(s)?.addEventListener('click',downloadReport));['#print-report','#print-report-plan'].forEach(s=>$(s)?.addEventListener('click',()=>{st.tab='findings';renderReport();setTimeout(()=>window.print(),50)}));
 $('#context-form')?.addEventListener('submit',async e=>{e.preventDefault();const chosen=new FormData(e.target).get('audience');if(!chosen){toast('Choose the primary audience first.');return}try{const res=await api('/api/refine',{report:r,audience:chosen});st.report=res.report;st.audience=chosen;saveReport();renderReport();toast('Priorities updated. The original evidence was preserved.')}catch(err){toast(err.message)}});
 document.querySelectorAll('[data-suggest]').forEach(el=>el.addEventListener('click',()=>{const box=$('#question');box.value=el.dataset.suggest;box.focus()}));
 $('#dialogue-form')?.addEventListener('submit',sendMessage);const msg=$('#dialogue-messages');if(msg)msg.scrollTop=msg.scrollHeight;
}
async function sendMessage(e){e.preventDefault();const q=$('#question').value.trim();if(!q)return;st.chat.push({role:'user',text:q});st.chat.push({role:'assistant',text:'Considering the evidence…',mode:'working'});renderReport();const submit=$('#send-question');if(submit)submit.disabled=true;try{const {answer}=await api('/api/discuss',{report:st.report,question:q});st.chat[st.chat.length-1]={role:'assistant',text:answer.answer,mode:answer.mode,evidenceIds:answer.evidenceIds};}catch(err){st.chat[st.chat.length-1]={role:'assistant',text:`I couldn't complete that response: ${err.message}`,mode:'unavailable'};}renderReport();}
function markdown(r){let lines=[`# Design Intelligence Assessment — ${r.title}`,'',r.sample?'**FICTIONAL EXAMPLE — NOT A REAL ASSESSMENT**':'**Evidence-grounded initial assessment**','',r.summary,'',`Scope: ${r.scope}`,`Created: ${r.createdAt}`,`Engine: ${r.engine}`,`Knowledge version: ${r.frameworkVersion}`,'','## Findings'];for(const f of r.findings){lines.push('',`### ${f.id} — ${f.heading}`,`Area: ${f.area} | Priority: ${f.priority} | Status: ${f.status}`,`Observation: ${f.observation}`,`Potential relevance: ${f.impact}`,`Recommendation: ${f.recommendation}`,`Validation needed: ${f.validation}`,`Evidence: ${f.evidenceIds.join(', ')}`,`Frameworks: ${f.frameworkIds.join(', ')}`)}if(r.contextualRecommendation)lines.push('','## Contextual priority',r.contextualRecommendation,'',r.contextRationale);lines.push('','## Evidence register',...r.evidence.map(e=>`- ${e.id}: ${e.label} — ${e.value}`),'','## Limitations',...r.limitations.map(x=>'- '+x),'','Free to use. No email or purchase required.');return lines.join('\n')}
function downloadReport(){if(!st.report)return;const data=new Blob([markdown(st.report)],{type:'text/markdown;charset=utf-8'});const u=URL.createObjectURL(data),a=document.createElement('a');a.href=u;a.download=`sovereign-assessment-${st.report.sample?'sample':st.report.title.replace(/[^a-z0-9-]/gi,'-').slice(0,40)}.md`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Complete report downloaded. No contact details required.')}
function renderMethod(){app.innerHTML=`<div class="eyebrow"><span class="eyeline"></span>THE METHOD BEHIND THE FINDINGS</div><h1 class="method-head">Intelligence should create<br><em>agency, not dependency.</em></h1><p class="method-intro">This prototype is guided by Sovereign Design and a curated, versioned subset of the Atlas. It distinguishes what can be observed from what still needs to be investigated. You can access the full assessment and recommendations without an account, email address, or payment.</p><div class="method-grid"><article class="method-card"><div class="method-num">01 / OBSERVATION</div><h3>Evidence before certainty.</h3><p>Claims must be linked to provided artifacts, inspected page content, or user-supplied statements. A screenshot cannot prove a working interaction. Page structure cannot prove conversion results.</p></article><article class="method-card"><div class="method-num">02 / INTERPRETATION</div><h3>Context changes priorities.</h3><p>The auditor can ask about the business, revise its recommendations, and expose assumptions. It should not secretly rewrite the observed evidence when circumstances change.</p></article><article class="method-card"><div class="method-num">03 / SOVEREIGNTY</div><h3>You remain the decision maker.</h3><p>Exploration and recommendations are free. The auditor never changes a website, gathers private credentials, sends outreach, or contacts a sales team for you.</p></article><article class="method-card"><div class="method-num">04 / LIMITATIONS</div><h3>A prototype, not a verdict.</h3><p>URL assessments inspect returned HTML. Visual screenshot assessment and open-ended AI interpretation require server-side model configuration. No validated financial impact is inferred.</p></article></div><p class="method-footer">Current knowledge version: <strong>${safe(st.knowledgeVersion||'2026-10-13.v0.1')}</strong>. This is a curated knowledge pack, not yet a full live synchronization of the Atlas. The underlying framework references can be inspected below.</p><div class="framework-links method-links" id="knowledge-links"></div><button class="secondary-button" style="margin-top:24px" id="back-assess">${icon('back',15)} ${st.report?'Return to report':'Start an assessment'}</button>`;$('#back-assess').addEventListener('click',()=>{st.view=st.report?'report':'start';render();scrollTop()});fetch('/api/knowledge').then(x=>x.json()).then(obj=>{$('#knowledge-links').innerHTML=obj.sources.map(x=>`<a href="${safe(x.url)}" target="_blank" rel="noopener noreferrer">↗ ${safe(x.title)}</a>`).join('')}).catch(()=>{});}
async function loadStatus(){try{const r=await fetch('/api/status');const o=await r.json();st.ai=!!o.aiConfigured;st.sourceCount=o.knowledgeCount;st.knowledgeVersion=o.knowledgeVersion;if(st.view==='start')renderStart()}catch{st.ai=false;toast('Unable to check the assessment service.')}}
render();loadStatus();
</script></body></html>
